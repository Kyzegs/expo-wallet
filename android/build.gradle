plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.wallet'
version = '0.1.0'

android {
  namespace "expo.modules.wallet"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("com.google.android.gms:play-services-pay:16.5.0")
}
